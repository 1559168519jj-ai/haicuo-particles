<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海错粒子生命</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;
    font-family:-apple-system,"PingFang SC",sans-serif;color:#cfd6e0}
  canvas{display:block;width:100vw;height:100vh}
  #ui{position:fixed;left:28px;bottom:24px;pointer-events:none;transition:opacity .8s}
  #name{font-size:22px;letter-spacing:.25em;font-weight:300;color:#fff}
  #sub{font-size:12px;letter-spacing:.4em;color:#d9a85c;margin-top:6px}
  #state{font-size:11px;letter-spacing:.3em;color:#6f7884;margin-top:10px;min-height:14px}
  #help{font-size:12px;line-height:1.9;color:#7d8794;margin-top:16px}
  #help b{color:#b9c2cc;font-weight:400}
  #cam{position:fixed;right:20px;bottom:20px;width:160px;opacity:.5;transform:scaleX(-1);border:1px solid #333;display:none}
  #shot{position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:50%;cursor:pointer;
    background:rgba(12,14,18,.55);border:1px solid rgba(220,210,190,.35);color:#e8dcc4;display:grid;place-items:center;
    transition:opacity .4s,border-color .2s;opacity:.55}
  #shot:hover,#shot:focus-visible{opacity:1;border-color:#d9a85c;outline:none}
  #shot svg{width:20px;height:20px}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s ease-out}
  #flash.on{opacity:.85;transition:none}
  #photo{position:fixed;right:22px;bottom:84px;width:min(360px,calc(100vw - 44px));background:rgba(10,12,16,.92);
    border:1px solid #2a2f37;border-radius:8px;padding:10px;cursor:auto;display:none;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #photo.on{display:block}
  #photo img{display:block;width:100%;border-radius:4px}
  #photo .row{display:flex;gap:8px;margin-top:10px}
  #photo a,#photo button{flex:1;text-align:center;font:12px -apple-system,"PingFang SC",sans-serif;letter-spacing:.15em;
    padding:8px 0;border-radius:5px;border:1px solid #2c333d;background:#1a1f27;color:#e6ebf0;text-decoration:none;cursor:pointer}
  #photo a{background:#d9a85c;border-color:#d9a85c;color:#16120c}
  body.hide #shot{opacity:0}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#aaa;font-size:14px}
  body.hide #ui,body.hide #cam{opacity:0}
  .hcur{position:fixed;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;pointer-events:none;
    border:1px solid rgba(235,225,205,.55);box-shadow:0 0 18px rgba(235,215,180,.35),inset 0 0 12px rgba(235,215,180,.25);
    opacity:0;transition:opacity .25s,transform .25s;transform:scale(.4)}
  .hcur.open{opacity:.85;transform:scale(1)}
  .hcur.fist{opacity:.35;transform:scale(.35)}
  body.room{cursor:default}
  #panel{position:fixed;top:16px;right:16px;width:250px;padding:14px 16px 12px;background:rgba(10,12,16,.78);
    border:1px solid #232830;border-radius:8px;font-size:12px;color:#aab3be;cursor:auto;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .3s}
  #panel.off{opacity:0;pointer-events:none}
  #panel .hd{display:flex;justify-content:space-between;color:#e6ebf0;letter-spacing:.2em;margin-bottom:10px}
  #panel .hd span{color:#66707c;letter-spacing:0}
  #panel label{display:grid;grid-template-columns:76px 1fr 34px;align-items:center;gap:8px;margin:7px 0}
  #panel input[type=range]{width:100%;accent-color:#d9a85c}
  #panel output{text-align:right;color:#d9a85c;font-variant-numeric:tabular-nums}
  #panel .sep{border-top:1px solid #232830;margin:10px 0 4px;padding-top:8px;color:#7d8794;letter-spacing:.2em}
  #panel .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  #panel button{flex:1;background:#1a1f27;color:#cfd6e0;border:1px solid #2c333d;border-radius:5px;padding:6px 4px;font:inherit;cursor:pointer}
  #panel button:hover{border-color:#d9a85c;color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="cam" playsinline muted></video>
<div class="hcur"></div><div class="hcur"></div><div class="hcur"></div>
<div id="ui">
  <div id="name">章鱼</div>
  <div id="sub">涡流触手</div>
  <div id="state"></div>
  <div id="help">
    <b>移动鼠标</b> 像观众的手 · 停留越久，溶解越深<br>
    <b>离开</b> 两秒后，粒子凝聚成下一种生命<br>
    <b>1 / 2 / 3</b> 章鱼 · 水母 · 鳐 · <b>E</b> 进化开关（关＝凝聚回原形）<br>
    <b>R</b> 展厅模拟 · <b>A</b> 自动触碰 · <b>C</b> 手势（张开手掌触碰，握拳离开） · <b>M</b> 声音 · <b>S</b> 拍照 · <b>V</b> 换环境视频 · <b>P</b> 调节面板 · <b>H</b> 隐藏界面 · <b>F</b> 全屏
  </div>
</div>
<div id="panel" class="off">
  <div class="hd">调节<span>P 键开关</span></div>
  <label>音量<input type="range" id="s_vol" min="0" max="1.5" step="0.01"><output></output></label>
  <label>展厅亮度<input type="range" id="s_room" min="0" max="3" step="0.01"><output></output></label>
  <label>整体曝光<input type="range" id="s_exp" min="0.3" max="3" step="0.01"><output></output></label>
  <label>生物亮度<input type="range" id="s_body" min="0" max="3" step="0.01"><output></output></label>
  <label>散开粒子<input type="range" id="s_dust" min="0" max="3" step="0.01"><output></output></label>
  <label>粒子大小<input type="range" id="s_size" min="0.5" max="2.5" step="0.01"><output></output></label>

  <div class="sep">自然环境</div>
  <label>环境视频<select id="vidSel" style="grid-column:2/4;background:#1a1f27;color:#cfd6e0;border:1px solid #2c333d;border-radius:5px;padding:4px;font:inherit">
    <option value="waterfall-bw">黑白瀑布</option><option value="kelp-rays">海藻林光柱</option>
    <option value="waterfall-rock">岩壁瀑布</option><option value="sea-surface">暗色海面</option></select></label>
  <label>环境亮度<input type="range" id="s_env" min="0" max="3" step="0.01"><output></output></label>
  <label>环境对比<input type="range" id="s_envc" min="0.3" max="3" step="0.01"><output></output></label>
  <label>环境色彩<input type="range" id="s_envcol" min="0" max="1" step="0.01"><output></output></label>
  <div class="sep">层次</div>
  <label>实体核心<input type="range" id="s_core" min="0" max="3" step="0.01"><output></output></label>
  <label>古画线描<input type="range" id="s_line" min="0" max="3" step="0.01"><output></output></label>
  <label>古籍文字<input type="range" id="s_page" min="0" max="3" step="0.01"><output></output></label>
  <label>底层流动<input type="range" id="s_bgflow" min="0" max="3" step="0.01"><output></output></label>
  <div class="row"><button id="bgPick">文字层换成自己的图…</button><button id="bgGen">恢复古籍页面</button></div>
  <div class="row"><button id="reset">恢复默认</button></div>
  <input type="file" id="bgFile" accept="image/*" hidden>
</div>
<button id="shot" title="拍照（S）" aria-label="拍照"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.6"/></svg></button>
<div id="flash"></div>
<div id="photo"><img id="photoImg" alt="拍下的画面"><div class="row"><a id="photoSave" download>保存图片</a><button id="photoClose">关闭</button></div></div>
<div id="err">这台电脑的浏览器不支持浮点渲染（需要 WebGL2 + EXT_color_buffer_float）</div>
<script src="refs.js"></script>
<script>
'use strict';
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,premultipliedAlpha:false});
if(!gl||!gl.getExtension('EXT_color_buffer_float')){document.getElementById('err').style.display='flex';throw 'no float';}
const qs=new URLSearchParams(location.search);
const MOBILE=/Mobi|Android/i.test(navigator.userAgent);
const SIDE=+qs.get('n')||(MOBILE?512:1024), N=SIDE*SIDE;
const IMG_W=1024, IMG_H=576, IMG_AR=IMG_W/IMG_H;
const CAM=3.2;

const CREATURES=[
  {key:'octopus',name:'章鱼',sub:'涡流触手'},
  {key:'jelly',name:'水母',sub:'环状脉冲'},
  {key:'ray',name:'鳐',sub:'张膜波浪'},
];

// ---------- GL 工具 ----------
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));throw gl.getShaderInfoLog(s);}return s;}
function program(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name);}
  return {p,u};}
function tex(w,h,ifmt,fmt,type,data,filter){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,ifmt,w,h,0,fmt,type,data||null);
  const f=filter||gl.NEAREST;gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,f);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,f);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
const f32=(w,h,d)=>tex(w,h,gl.RGBA32F,gl.RGBA,gl.FLOAT,d);
const f16=(w,h)=>tex(w,h,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,null,gl.LINEAR);
function fbo(...texs){const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  texs.forEach((t,i)=>gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,0));
  gl.drawBuffers(texs.map((_,i)=>gl.COLOR_ATTACHMENT0+i));return f;}
function bindTex(prog,name,unit,t){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(prog.u[name],unit);}
const emptyVao=gl.createVertexArray();
const QUAD_VS=`#version 300 es
out vec2 vUv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;

// ---------- 从概念图按亮度采样粒子的"家" ----------
const rnd=Math.random;
function gauss(){let u=1-rnd(),v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v);}
function loadImg(src){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.src=src;});}
// 按亮度分布撒点：亮处密、暗处稀。each(i,u,v,l,R,G,B) 写入第 i 个粒子
function sampleCanvas(c,gamma,each){
  const w=c.width,h=c.height,d=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
  const P=w*h,cdf=new Float64Array(P),L=new Float32Array(P);
  let acc=0;
  for(let i=0;i<P;i++){
    const l=(d[i*4]*0.3+d[i*4+1]*0.55+d[i*4+2]*0.15)/255;L[i]=l;
    acc+=Math.pow(Math.max(0,l-0.035),gamma);cdf[i]=acc;
  }
  for(let i=0;i<N;i++){
    const r=rnd()*acc;let lo=0,hi=P-1;
    while(lo<hi){const m=(lo+hi)>>1;if(cdf[m]<r)lo=m+1;else hi=m;}
    each(i,(lo%w+rnd())/w,(((lo/w)|0)+rnd())/h,L[lo],d[lo*4],d[lo*4+1],d[lo*4+2]);
  }
}
function imageCanvas(im,w,h){   // 等比铺满（cover）
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});
  const k=Math.max(w/im.width,h/im.height);x.drawImage(im,(w-im.width*k)/2,(h-im.height*k)/2,im.width*k,im.height*k);return c;
}
async function buildHome(src){
  const c=imageCanvas(await loadImg(src),IMG_W,IMG_H);
  // 低频起伏做假纵深，转动时有视差
  const nz=(u,v)=>Math.sin(u*5.1+1.3)*Math.cos(v*4.3-0.7)*0.5+Math.sin(u*11.7-v*9.1)*0.25;
  const home=new Float32Array(N*4),col=new Uint8Array(N*4);
  sampleCanvas(c,1.25,(i,u,v,l,R,G,B)=>{
    home[i*4]=(u-0.5)*IMG_AR*2;home[i*4+1]=(0.5-v)*2;
    home[i*4+2]=(l-0.35)*0.2+nz(u,v)*0.16+gauss()*0.012;
    home[i*4+3]=l;
    col[i*4]=R;col[i*4+1]=G;col[i*4+2]=B;
    col[i*4+3]=Math.min(255,Math.max(0,(R-B)*2.2));   // 暖金程度
  });
  return {home:f32(SIDE,SIDE,home),col:tex(SIDE,SIDE,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,col)};
}

// ---------- 《海错图》原画 → 两层粒子 ----------
// 从米色纸上把墨迹和设色分离出来；line＝轮廓线（原画线描），ink＝墨迹本身（题字、礁石）
function inkCanvas(im,mode){
  const w=IMG_W,h=IMG_H,k=Math.min(w/im.width,h/im.height)*0.94;
  const iw=Math.round(im.width*k),ih=Math.round(im.height*k);
  const src=document.createElement('canvas');src.width=iw;src.height=ih;
  const sx=src.getContext('2d',{willReadFrequently:true});sx.drawImage(im,0,0,iw,ih);
  const d=sx.getImageData(0,0,iw,ih).data,P=iw*ih,lum=new Float32Array(P);
  for(let i=0;i<P;i++)lum[i]=d[i*4]*0.3+d[i*4+1]*0.55+d[i*4+2]*0.15;
  const th=Float32Array.from(lum).sort()[(P*0.7)|0];
  let pr=0,pg=0,pb=0,n=0;                       // 纸色＝最亮三成像素的平均
  for(let i=0;i<P;i++)if(lum[i]>=th){pr+=d[i*4];pg+=d[i*4+1];pb+=d[i*4+2];n++;}
  pr/=n;pg/=n;pb/=n;
  let ink=new Float32Array(P);
  for(let i=0;i<P;i++){const a=(d[i*4]-pr)/255,b=(d[i*4+1]-pg)/255,c=(d[i*4+2]-pb)/255;ink[i]=Math.min(1,Math.max(0,Math.sqrt(a*a+b*b+c*c)*3.2-0.06));}
  const bl=new Float32Array(P);
  for(let y=1;y<ih-1;y++)for(let x=1;x<iw-1;x++){const i=y*iw+x;bl[i]=(ink[i]*4+ink[i-1]+ink[i+1]+ink[i-iw]+ink[i+iw])/8;}
  ink=bl;
  const out=document.createElement('canvas');out.width=w;out.height=h;
  const ox=out.getContext('2d',{willReadFrequently:true}),img=ox.createImageData(w,h);
  const offX=(w-iw)>>1,offY=(h-ih)>>1;
  for(let y=1;y<ih-1;y++)for(let x=1;x<iw-1;x++){
    const i=y*iw+x;let v;
    const gx=ink[i+1-iw]+2*ink[i+1]+ink[i+1+iw]-ink[i-1-iw]-2*ink[i-1]-ink[i-1+iw];
    const gy=ink[i-1+iw]+2*ink[i+iw]+ink[i+1+iw]-ink[i-1-iw]-2*ink[i-iw]-ink[i+1-iw];
    const edge=Math.min(1,Math.hypot(gx,gy)*1.4);
    v=mode==='line'?edge+ink[i]*0.06:edge*0.7+Math.pow(ink[i],2.0)*0.35;   // 题字笔画细，靠墨迹；礁石大块，只留轮廓
    const g=Math.min(255,v*255),o=((y+offY)*w+x+offX)*4;
    img.data[o]=img.data[o+1]=img.data[o+2]=g;img.data[o+3]=255;
  }
  ox.putImageData(img,0,0);return out;
}
function layerTex(c,gamma,map){const a=new Float32Array(N*4);sampleCanvas(c,gamma,(i,u,v,l)=>map(a,i,u,v,l));return f32(SIDE,SIDE,a);}
// 中层：原画线描，比生物略大、稍错开，像祖先的残影
const lineMap=(a,i,u,v,l)=>{a[i*4]=(u-0.5)*IMG_AR*2.3+0.14;a[i*4+1]=(0.5-v)*2.3+0.05;a[i*4+2]=-0.35+0.06*Math.sin(u*6.0+v*3.0)+0.004*gauss();a[i*4+3]=l;};
// 远层：原书整页（竖排题字、礁石），铺满身后；w 加 2 作为"文字层"的记号
const pageMap=(a,i,u,v,l)=>{a[i*4]=(u-0.5)*5.7;a[i*4+1]=(0.5-v)*3.2;a[i*4+2]=-1.1+0.08*Math.sin(u*3.0)+0.004*gauss();a[i*4+3]=l+2;};
let pageCustom=null;

// ---------- 粒子状态 ----------
const seed=new Float32Array(N*4),pos0=new Float32Array(N*4);
for(let i=0;i<N;i++){
  seed[i*4]=rnd();seed[i*4+1]=rnd();seed[i*4+2]=rnd();seed[i*4+3]=rnd();
  pos0[i*4]=(rnd()-0.5)*5;pos0[i*4+1]=(rnd()-0.5)*2.6;pos0[i*4+2]=(rnd()-0.5)*1.6;pos0[i*4+3]=1;
}
const seedTex=f32(SIDE,SIDE,seed);
const posT=[f32(SIDE,SIDE,pos0),f32(SIDE,SIDE,null)],velT=[f32(SIDE,SIDE,new Float32Array(N*4)),f32(SIDE,SIDE,null)];
const simF=[fbo(posT[0],velT[0]),fbo(posT[1],velT[1])];
let ping=0;

// 溶解场（屏幕空间，低分辨率）
const FW=160,FH=90;
const fieldT=[f16(FW,FH),f16(FW,FH)],fieldF=[fbo(fieldT[0]),fbo(fieldT[1])];let fping=0;
// 摄像头运动
const GW=64,GH=36;const camTex=tex(GW,GH,gl.R8,gl.RED,gl.UNSIGNED_BYTE,new Uint8Array(GW*GH),gl.LINEAR);

// ---------- 着色器 ----------
const NOISE=`
float hash(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
vec3 pot(vec3 p){return vec3(vnoise(p),vnoise(p+vec3(31.4,7.1,-3.3)),vnoise(p+vec3(-9.2,17.7,23.1)))
  +0.5*vec3(vnoise(p*2.3+5.0),vnoise(p*2.3+vec3(12.0,-4.0,8.0)),vnoise(p*2.3+vec3(-21.0,3.0,1.0)));}
vec3 curl(vec3 p){const float e=0.08;
  vec3 dx=vec3(e,0,0),dy=vec3(0,e,0),dz=vec3(0,0,e);
  vec3 px0=pot(p-dx),px1=pot(p+dx),py0=pot(p-dy),py1=pot(p+dy),pz0=pot(p-dz),pz1=pot(p+dz);
  return vec3((py1.z-py0.z)-(pz1.y-pz0.y),(pz1.x-pz0.x)-(px1.z-px0.z),(px1.y-px0.y)-(py1.x-py0.x))/(2.0*e);}
`;
const COMMON=`
uniform vec2 uScale;uniform float uYaw;
const float CAM=${CAM.toFixed(2)};
vec3 view(vec3 p){float c=cos(uYaw),s=sin(uYaw);return vec3(p.x*c+p.z*s,p.y,-p.x*s+p.z*c);}
vec2 proj(vec3 p,out float w){w=CAM/(CAM-p.z);return p.xy*w*uScale;}
`;

const DEFORM=`
// 让概念图里的身体动起来
vec3 deform(vec3 h,vec4 S){
  vec3 p=h;float t=uT;
  if(uCreature<0.5){            // 章鱼：以身体中心为轴，触手沿不同涡流舒卷
    vec2 c=vec2(0.0,0.2);vec2 r=p.xy-c;float d=length(r),a=atan(r.y,r.x);

    a+=0.16*m*sin(t*0.42+d*3.6+a*1.3)+0.05*m*sin(t*0.9-d*7.0);
    d*=1.0+0.035*sin(t*0.65-d*4.0);
    p.xy=c+d*vec2(cos(a),sin(a));p.z+=0.12*m*sin(t*0.5+a*2.0+d*3.0);
  }else if(uCreature<1.5){      // 水母：收缩波从伞顶传到伞缘，触手随后摆动
    float cx=-0.05,top=0.95,rim=0.05;
    float bell=smoothstep(rim-0.15,rim+0.1,p.y);
    float ph=t*1.35-(top-p.y)*2.4;float pulse=max(0.0,sin(ph));
    p.x=cx+(p.x-cx)*(1.0-0.07*pulse*bell);p.y+=0.035*pulse*bell;
    float below=1.0-bell;float k=max(0.0,rim-p.y);
    p.x+=below*k*0.09*sin(t*1.2-p.y*5.0+S.x*0.6);p.z+=below*k*0.08*cos(t*0.9-p.y*4.0);
    p.y+=below*0.03*sin(t*1.35-k*3.0);
  }else{                        // 鳐：大波从身体中央向两侧翼尖传播
    float cx=-0.15;float dx=p.x-cx,ax=abs(dx);
    float fl=0.17*sin(t*1.0-ax*2.1)*pow(ax,1.35);
    p.y+=fl;p.z+=fl*0.6;p.x-=0.03*pow(ax,1.5)*cos(t*1.0-ax*2.1)*sign(dx);

  const ro=roomCam.ro,fw=norm(sub(roomCam.ta,ro)),rt=norm(cross(fw,[0,1,0])),up=cross(rt,fw);
  const sx=(mouse.px/innerWidth*2-1)*1.6,sy=(1-mouse.py/innerHeight*2)*1.6*innerHeight/innerWidth;

  const h0=hands[0];h0.on=false;
  if(mouse.on){
    const {ro,d}=mouseRay();const tw=-ro[2]/d[2],wx=ro[0]+d[0]*tw,wy=ro[1]+d[1]*tw;
    if(tw>0&&wx>P[0]&&wx<P[2]&&wy>P[1]&&wy<P[3]){[h0.x,h0.y]=wallToNdc(wx,wy);h0.on=true;h0.last=mouse.last;}
  }

    g.timer-=dt;

    else if(g.mode==='reach'){

      const files=await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${HT_VER}/wasm`);
      handTrack.lm=await vision.HandLandmarker.createFromOptions(files,{baseOptions:{

    const w=lm[0],palm=[0,5,9,13,17].reduce((a,i)=>({x:a.x+lm[i].x/5,y:a.y+lm[i].y/5}),{x:0,y:0});
    const ext=[[8,6],[12,10],[16,14],[20,18]].filter(([tip,pip])=>d2(lm[tip],w)>d2(lm[pip],w)*1.1).length;
    // 镜像，并放大一点：手不用伸到摄像头画面边缘就能碰到墙边
    return {x:Math.max(-1,Math.min(1,(0.5-palm.x)*2.5)),y:Math.max(-1,Math.min(1,(0.5-palm.y)*2.5)),open:ext>=3};
  });
}

    master.gain.setTargetAtTime(muted?0:set.vol,ctx.currentTime,0.3);
    padFilter.frequency.setTargetAtTime(500+1400*dissolve,ctx.currentTime,0.8);   // 溶解时声音变亮
    pingAcc+=dt*activity*5;
    while(pingAcc>1){pingAcc-=1+Math.random()*0.6;ping(pan+(Math.random()-0.5)*0.4,0.6+Math.random()*0.6);}
  }
  function shutter(){if(!ctx)return;const t=ctx.currentTime;
    [0,0.07].forEach((dt,i)=>{const n=ctx.createBufferSource();n.buffer=noiseBuf(0.15);const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=1800+i*900;
      const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t+dt);g.gain.linearRampToValueAtTime(0.25,t+dt+0.003);g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.06);
      n.connect(f).connect(g).connect(master);n.start(t+dt);n.stop(t+dt+0.12);});}
  return {start,setChord,swell,update,shutter,toggleMute(){if(started)muted=!muted;},get started(){return started;},get muted(){return muted;}};
})();
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(!Sound.started){Sound.start();Sound.setChord(cur,0.1);}}));

// ---------- 主循环 ----------
let homes=[],t0=performance.now(),last=t0,frame=0,prevPhase='form',prevCur=0;
function frameStep(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=(now-t0)/1000;frame++;
  readHands(now);
  updateVideoTex();

  // 手：最近 1.2 秒内有移动才算"在场"
  if(room)updateVisitors(dt,now,t);
  else{const h=hands[0];h.on=mouse.on;h.last=mouse.last;h.x=mouse.px/innerWidth*2-1;h.y=1-mouse.py/innerHeight*2;hands[1].on=hands[2].on=false;}
  if(handTrack.on)hands.forEach((h,k)=>{     // 开了手势识别：三只手全部来自摄像头
    const d=handTrack.hands[k];
    if(d&&d.open){if(!h.on){h.x=h.lx=d.x;h.y=h.ly=d.y;}h.x+=(d.x-h.x)*0.5;h.y+=(d.y-h.y)*0.5;h.on=true;h.last=now;}
    else h.on=false;
  });
  placeCursors();
  const hPos=new Float32Array(6),hVel=new Float32Array(6),hOn=new Float32Array(3),hAmt=new Float32Array(3);
  let handActive=false;
  hands.forEach((h,k)=>{
    h.vx=h.vx*0.6+(h.x-h.lx)*0.4;h.vy=h.vy*0.6+(h.y-h.ly)*0.4;h.lx=h.x;h.ly=h.y;
    if(!h.on)h.vx=h.vy=0;
    const act=h.on&&now-h.last<1200;handActive=handActive||act;
    hPos[k*2]=h.x;hPos[k*2+1]=h.y;hVel[k*2]=h.vx;hVel[k*2+1]=h.vy;hOn[k]=h.on?1:0;
    hAmt[k]=act?Math.min(1,0.25+Math.hypot(h.vx,h.vy)*25):0;
  });
  const presence=handActive;
  if(presence){lastPresence=now;exposure+=dt;idleSince=now;}

  // 溶解 → 离开 → 凝聚（进化成下一种，或回到原形）
  if(phase==='form'){
    morph=Math.max(0,morph-dt*0.2);
    if(!presence&&now-lastPresence>900&&exposure>2.5){exposure=0;next=evolve?(cur+1)%3:cur;phase='out';}
    if(now-idleSince>50000){idleSince=now;next=(cur+1)%3;phase='out';}
    if(!presence&&now-lastPresence>6000)exposure=Math.max(0,exposure-dt*0.5);
  }else{
    morph=Math.min(1.25,morph+dt*0.9);
    if(morph>=1.25){cur=next;phase='form';ui.name.textContent=CREATURES[cur].name;ui.sub.textContent=CREATURES[cur].sub;}
  }
  if(phase!==prevPhase){if(phase==='out')Sound.started&&Sound.swell();prevPhase=phase;}
  if(cur!==prevCur){Sound.setChord(cur);prevCur=cur;}
  let act=0,pan=0;hands.forEach((h,k)=>{if(hAmt[k]>0){act+=hAmt[k];pan+=h.x*hAmt[k];}});
  Sound.update(dt,act,act>0?pan/act:0,Math.max(presence?0.7:0,phase==='out'?1:morph*0.6));
  ui.state.textContent=!Sound.started?'点击任意处开启声音':phase==='out'?'溶解':presence?'被触碰 · 溶解':morph>0.05?'凝聚':'';

  const [sx,sy]=scale(),aspect=W/H,yaw=0.13*Math.sin(t*0.09);

  // 1. 溶解场
  gl.disable(gl.BLEND);gl.bindVertexArray(emptyVao);
  gl.useProgram(fieldP.p);gl.bindFramebuffer(gl.FRAMEBUFFER,fieldF[1-fping]);gl.viewport(0,0,FW,FH);
  bindTex(fieldP,'uPrev',0,fieldT[fping]);bindTex(fieldP,'uCam',1,camTex);
  gl.uniform2fv(fieldP.u['uHands[0]'],hPos);gl.uniform1fv(fieldP.u['uHandAmts[0]'],hAmt);gl.uniform2f(fieldP.u.uTexel,1/FW,1/FH);
  gl.uniform1f(fieldP.u.uPresence,presence?1:0);gl.uniform1f(fieldP.u.uCamOn,camOn?1:0);
  gl.uniform1f(fieldP.u.uAspect,aspect);gl.uniform1f(fieldP.u.uT,t);
  gl.drawArrays(gl.TRIANGLES,0,3);fping=1-fping;

  // 2. 粒子模拟
  gl.useProgram(simP.p);gl.bindFramebuffer(gl.FRAMEBUFFER,simF[1-ping]);gl.viewport(0,0,SIDE,SIDE);
  bindTex(simP,'uPos',0,posT[ping]);bindTex(simP,'uVel',1,velT[ping]);bindTex(simP,'uSeed',2,seedTex);
  bindTex(simP,'uHome',3,homes[cur].home);bindTex(simP,'uField',4,fieldT[fping]);bindTex(simP,'uCam',5,camTex);bindTex(simP,'uLineHome',6,homes[cur].line);bindTex(simP,'uPageHome',7,pageCustom||homes[cur].page);
  gl.uniform1f(simP.u.uBgFlow,set.bgflow);gl.uniform1f(simP.u.uEnvC,set.envc);bindTex(simP,'uVideo',8,vidTex);
  gl.uniform1f(simP.u.uT,t);gl.uniform1f(simP.u.uMorph,morph);gl.uniform1f(simP.u.uCamOn,camOn?1:0);
  gl.uniform1f(simP.u.uCreature,cur);gl.uniform1f(simP.u.uAspect,aspect);
  gl.uniform2fv(simP.u['uHands[0]'],hPos);gl.uniform2fv(simP.u['uHandVels[0]'],hVel);gl.uniform1fv(simP.u['uHandOns[0]'],hOn);
  gl.uniform2f(simP.u.uScale,sx,sy);gl.uniform1f(simP.u.uYaw,yaw);
  gl.drawArrays(gl.TRIANGLES,0,3);ping=1-ping;

  // 3. 画进 HDR：上一帧先淡出留一点拖影，再叠加粒子
  gl.bindFramebuffer(gl.FRAMEBUFFER,hdrF);gl.viewport(0,0,RW,RH);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ZERO,gl.SRC_ALPHA);
  gl.useProgram(fadeP.p);gl.uniform1f(fadeP.u.uK,0.3);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.blendFunc(gl.ONE,gl.ONE);
  if(set.core>0.001){
    gl.useProgram(coreP.p);gl.bindVertexArray(coreVao);
    bindTex(coreP,'uField',0,fieldT[fping]);bindTex(coreP,'uImg',1,homes[cur].img);
    gl.uniform1f(coreP.u.uT,t);gl.uniform1f(coreP.u.uCreature,cur);gl.uniform1f(coreP.u.uMorph,morph);
    gl.uniform3f(coreP.u.uCoreC,...CORE_C[cur]);gl.uniform1f(coreP.u.uGain,set.core);
    gl.uniform2f(coreP.u.uScale,sx,sy);gl.uniform1f(coreP.u.uYaw,yaw);
    gl.drawElements(gl.TRIANGLES,CORE_COUNT,gl.UNSIGNED_SHORT,0);
    gl.bindVertexArray(emptyVao);
  }
  gl.useProgram(drawP.p);
  bindTex(drawP,'uPos',0,posT[ping]);bindTex(drawP,'uSeed',1,seedTex);bindTex(drawP,'uCol',2,homes[cur].col);
  gl.uniform1i(drawP.u.uSide,SIDE);gl.uniform1f(drawP.u.uDpr,RW/W);gl.uniform1f(drawP.u.uSize,0.95*set.size);
  gl.uniform1f(drawP.u.uBody,set.body);gl.uniform1f(drawP.u.uDust,set.dust);gl.uniform1f(drawP.u.uLine,set.line);gl.uniform1f(drawP.u.uPage,set.page);
  gl.uniform1f(drawP.u.uEnv,set.env*(vidReady?1:0));gl.uniform1f(drawP.u.uEnvCol,set.envcol);
  bindTex(drawP,'uVel',3,velT[ping]);bindTex(drawP,'uVideo',4,vidTex);
  gl.uniform1f(drawP.u.uEnergy,0.1*Math.pow(1024/SIDE,2));
  gl.uniform2f(drawP.u.uScale,sx,sy);gl.uniform1f(drawP.u.uYaw,yaw);
  gl.drawArrays(gl.POINTS,0,N);
  gl.disable(gl.BLEND);

  // 4. 泛光
  gl.useProgram(brightP.p);gl.bindFramebuffer(gl.FRAMEBUFFER,bF.b1);gl.viewport(0,0,bF.w4,bF.h4);
  bindTex(brightP,'uSrc',0,hdrT);gl.uniform2f(brightP.u.uTexel,1/RW,1/RH);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.useProgram(blurP.p);
  const blur=(src,dst,w,h,dx,dy)=>{gl.bindFramebuffer(gl.FRAMEBUFFER,dst);gl.viewport(0,0,w,h);bindTex(blurP,'uSrc',0,src);gl.uniform2f(blurP.u.uDir,dx/w,dy/h);gl.drawArrays(gl.TRIANGLES,0,3);};
  blur(b1,bF.b2,bF.w4,bF.h4,1,0);blur(b2,bF.b1,bF.w4,bF.h4,0,1);
  blur(b1,bF.b3,bF.w8,bF.h8,1,0);blur(b3,bF.b4,bF.w8,bF.h8,0,1);
  blur(b4,bF.b3,bF.w8,bF.h8,1.5,0);blur(b3,bF.b4,bF.w8,bF.h8,0,1.5);

  // 5. 合成到屏幕
  gl.useProgram(compP.p);gl.bindFramebuffer(gl.FRAMEBUFFER,room?wallF:null);gl.viewport(0,0,RW,RH);
  bindTex(compP,'uHdr',0,hdrT);bindTex(compP,'uB1',1,b1);bindTex(compP,'uB2',2,b4);
  gl.uniform1f(compP.u.uExp,set.exp);gl.uniform1f(compP.u.uBloom,set.bloom);gl.uniform1f(compP.u.uT,t%100);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // 6. 展厅
  if(room){
    gl.bindTexture(gl.TEXTURE_2D,wallT);gl.generateMipmap(gl.TEXTURE_2D);
    gl.useProgram(roomP.p);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cv.width,cv.height);
    bindTex(roomP,'uWall',0,wallT);gl.uniform2f(roomP.u.uRes,cv.width,cv.height);gl.uniform1f(roomP.u.uRoomExp,set.room);gl.uniform1f(roomP.u.uT,t);
    roomCam.ro=[ROOM.ro[0]+0.02*Math.sin(t*0.13),ROOM.ro[1]+0.01*Math.sin(t*0.19),ROOM.ro[2]];   // 手持般的极轻微晃动
    gl.uniform3f(roomP.u.uRo,...roomCam.ro);gl.uniform3f(roomP.u.uTa,...roomCam.ta);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
}
// ---------- 拍照：截下当前画面，加落款，预览后保存 ----------
let photoWanted=false,photoTimer=0,photoUrl=null;
const photoBox=document.getElementById('photo'),photoImg=document.getElementById('photoImg'),photoSave=document.getElementById('photoSave');
function takePhoto(){photoWanted=true;}
document.getElementById('shot').addEventListener('click',e=>{e.stopPropagation();takePhoto();});
document.getElementById('photoClose').addEventListener('click',()=>photoBox.classList.remove('on'));
['shot','photo'].forEach(id=>document.getElementById(id).addEventListener('pointermove',e=>{e.stopPropagation();mouse.on=false;}));
function capturePhoto(){        // 必须在画完这一帧的同一时刻读画布
  const w=cv.width,h=cv.height,c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.drawImage(cv,0,0);
  const k=h/900,pad=Math.round(36*k),d=new Date(),two=n=>String(n).padStart(2,'0');
  const date=`${d.getFullYear()}.${two(d.getMonth()+1)}.${two(d.getDate())}`;
  const grad=x.createLinearGradient(0,h-200*k,0,h);grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,0,.55)');
  x.fillStyle=grad;x.fillRect(0,h-200*k,w,200*k);
  x.textBaseline='alphabetic';x.fillStyle='rgba(255,255,255,.92)';
  x.font=`300 ${Math.round(30*k)}px -apple-system,"PingFang SC",sans-serif`;
  x.fillText(`海错粒子生命 · ${CREATURES[cur].name}`,pad,h-pad-34*k);
  x.fillStyle='rgba(217,168,92,.95)';x.font=`${Math.round(15*k)}px -apple-system,"PingFang SC",sans-serif`;
  x.fillText(`${CREATURES[cur].sub}　${date}`,pad,h-pad);
  x.strokeStyle='rgba(217,168,92,.6)';x.lineWidth=Math.max(1,k);x.beginPath();x.moveTo(pad,h-pad-24*k);x.lineTo(pad+60*k,h-pad-24*k);x.stroke();
  c.toBlob(b=>{
    if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(b);
    photoImg.src=photoUrl;photoSave.href=photoUrl;
    photoSave.download=`海错粒子生命-${CREATURES[cur].key}-${d.getFullYear()}${two(d.getMonth()+1)}${two(d.getDate())}-${two(d.getHours())}${two(d.getMinutes())}${two(d.getSeconds())}.png`;
    photoBox.classList.add('on');clearTimeout(photoTimer);photoTimer=setTimeout(()=>photoBox.classList.remove('on'),20000);
  },'image/png');
  const f=document.getElementById('flash');f.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('on')));
  Sound.shutter&&Sound.shutter();
}
function loop(now){frameStep(now);if(photoWanted){photoWanted=false;capturePhoto();}requestAnimationFrame(loop);}

(async()=>{
  ui.state.textContent='载入概念图…';
  for(const c of CREATURES){
    const h=await buildHome(window.REFS[c.key]);
    h.img=imageTex(await loadImg(window.REFS[c.key]));
    h.line=layerTex(inkCanvas(await loadImg(window.REFS['haicuo_'+c.key]),'line'),1.4,lineMap);
    h.page=layerTex(inkCanvas(await loadImg(window.REFS['page_'+c.key]),'ink'),1.2,pageMap);
    homes.push(h);
  }
  ui.state.textContent='';
  requestAnimationFrame(loop);
})();
